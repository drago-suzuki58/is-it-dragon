[project]
name = "is-it-dragon"
version = "0.1.0"
description = "画像にドラゴンが含まれているかを判定する"
readme = "README.md"
authors = [
    { name = "drago-suzuki58", email = "dorasuzu58@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
]

[project.scripts]
lab = "is_it_dragon.apps.lab:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
